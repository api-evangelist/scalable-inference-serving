- name: vLLM OpenAI-Compatible API
  description: >-
    vLLM is a high-throughput and memory-efficient inference engine for LLMs, implementing PagedAttention
    for efficient KV cache management. vLLM exposes an OpenAI-compatible REST API allowing seamless migration
    from OpenAI endpoints. In 2026, vLLM integrates with KServe via LLMInferenceService and llm-d for
    production-grade distributed LLM inference. Powers major LLM deployments at scale.
  image: https://docs.vllm.ai/en/stable/_static/logo/vllm-logo-text-light.png
  humanUrl: https://docs.vllm.ai/
  baseUrl: https://vllm.example.com/v1
