- name: Ray Serve REST API
  description: >-
    Ray Serve is a scalable model serving library built on Ray, designed for building online inference
    APIs. Supports composable deployments, autoscaling, HTTP ingress, gRPC, WebSockets, and request batching.
    Integrates with any ML framework. The Ray Serve dashboard and REST API manage deployments, replicas,
    routes, and application status.
  image: https://www.ray.io/favicon.ico
  humanUrl: https://docs.ray.io/en/latest/serve/index.html
  baseUrl: https://ray-serve.example.com
