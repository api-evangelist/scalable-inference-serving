- name: MLflow Model Registry REST API
  description: >-
    MLflow is an open source platform for managing the ML lifecycle, including experiment tracking, reproducibility,
    and deployment. The MLflow REST API manages experiments, runs, metrics, parameters, artifacts, and
    the Model Registry for versioning and staging model deployments. CNCF-adjacent; used with KServe for
    model lifecycle management.
  image: https://mlflow.org/favicon.ico
