- name: NVIDIA Triton Inference Server HTTP API
  description: >-
    NVIDIA Triton Inference Server is an open-source inference serving software that implements the KServe
    Open Inference Protocol (V2). Supports TensorRT, ONNX, TensorFlow, PyTorch, and Python backends. Provides
    dynamic batching, model ensembles, model analyzers, and GPU/CPU inference. Used extensively in production
    ML pipelines requiring maximum throughput.
  image: https://developer.nvidia.com/favicon.ico
  humanUrl: https://developer.nvidia.com/triton-inference-server
  baseUrl: https://triton.example.com
