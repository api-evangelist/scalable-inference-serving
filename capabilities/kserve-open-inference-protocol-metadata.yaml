naftiko: 1.0.0-alpha2
info:
  label: KServe Open Inference Protocol API — Metadata
  description: 'KServe Open Inference Protocol API — Metadata. 3 operations. Lead operation: Get Server Metadata. Self-contained
    Naftiko capability covering one Scalable Inference Serving business surface.'
  tags:
  - Scalable Inference Serving
  - Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SCALABLE_INFERENCE_SERVING_API_KEY: SCALABLE_INFERENCE_SERVING_API_KEY
capability:
  consumes:
  - type: http
    namespace: kserve-open-inference-protocol-metadata
    baseUri: https://inference.kserve.example.com
    description: KServe Open Inference Protocol API — Metadata business capability. Self-contained, no shared references.
    resources:
    - name: v2
      path: /v2
      operations:
      - name: getservermetadata
        method: GET
        description: Get Server Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-models-model_name
      path: /v2/models/{model_name}
      operations:
      - name: getmodelmetadata
        method: GET
        description: Get Model Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          description: Name of the model.
          required: true
    - name: v2-models-model_name-versions-model_version
      path: /v2/models/{model_name}/versions/{model_version}
      operations:
      - name: getmodelversionmetadata
        method: GET
        description: Get Model Version Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          required: true
        - name: model_version
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: kserve-open-inference-protocol-metadata-rest
    port: 8080
    description: REST adapter for KServe Open Inference Protocol API — Metadata. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2
      name: v2
      description: REST surface for v2.
      operations:
      - method: GET
        name: getservermetadata
        description: Get Server Metadata
        call: kserve-open-inference-protocol-metadata.getservermetadata
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/models/{model-name}
      name: v2-models-model-name
      description: REST surface for v2-models-model_name.
      operations:
      - method: GET
        name: getmodelmetadata
        description: Get Model Metadata
        call: kserve-open-inference-protocol-metadata.getmodelmetadata
        with:
          model_name: rest.model_name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/models/{model-name}/versions/{model-version}
      name: v2-models-model-name-versions-model-version
      description: REST surface for v2-models-model_name-versions-model_version.
      operations:
      - method: GET
        name: getmodelversionmetadata
        description: Get Model Version Metadata
        call: kserve-open-inference-protocol-metadata.getmodelversionmetadata
        with:
          model_name: rest.model_name
          model_version: rest.model_version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kserve-open-inference-protocol-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for KServe Open Inference Protocol API — Metadata. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-server-metadata
      description: Get Server Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-metadata.getservermetadata
      outputParameters:
      - type: object
        mapping: $.
    - name: get-model-metadata
      description: Get Model Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-metadata.getmodelmetadata
      with:
        model_name: tools.model_name
      outputParameters:
      - type: object
        mapping: $.
    - name: get-model-version-metadata
      description: Get Model Version Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-metadata.getmodelversionmetadata
      with:
        model_name: tools.model_name
        model_version: tools.model_version
      outputParameters:
      - type: object
        mapping: $.
