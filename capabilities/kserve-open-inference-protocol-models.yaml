naftiko: 1.0.0-alpha2
info:
  label: KServe Open Inference Protocol API — Models
  description: 'KServe Open Inference Protocol API — Models. 4 operations. Lead operation: Get Model Metadata. Self-contained
    Naftiko capability covering one Scalable Inference Serving business surface.'
  tags:
  - Scalable Inference Serving
  - Models
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SCALABLE_INFERENCE_SERVING_API_KEY: SCALABLE_INFERENCE_SERVING_API_KEY
capability:
  consumes:
  - type: http
    namespace: kserve-open-inference-protocol-models
    baseUri: https://inference.kserve.example.com
    description: KServe Open Inference Protocol API — Models business capability. Self-contained, no shared references.
    resources:
    - name: v2-models-model_name
      path: /v2/models/{model_name}
      operations:
      - name: getmodelmetadata
        method: GET
        description: Get Model Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          description: Name of the model.
          required: true
    - name: v2-models-model_name-ready
      path: /v2/models/{model_name}/ready
      operations:
      - name: checkmodelreadiness
        method: GET
        description: Check Model Readiness
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          description: Name of the model to check readiness for.
          required: true
    - name: v2-models-model_name-versions-model_version
      path: /v2/models/{model_name}/versions/{model_version}
      operations:
      - name: getmodelversionmetadata
        method: GET
        description: Get Model Version Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          required: true
        - name: model_version
          in: path
          type: string
          required: true
    - name: v2-models-model_name-versions-model_version-ready
      path: /v2/models/{model_name}/versions/{model_version}/ready
      operations:
      - name: checkmodelversionreadiness
        method: GET
        description: Check Model Version Readiness
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: model_name
          in: path
          type: string
          required: true
        - name: model_version
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: kserve-open-inference-protocol-models-rest
    port: 8080
    description: REST adapter for KServe Open Inference Protocol API — Models. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2/models/{model-name}
      name: v2-models-model-name
      description: REST surface for v2-models-model_name.
      operations:
      - method: GET
        name: getmodelmetadata
        description: Get Model Metadata
        call: kserve-open-inference-protocol-models.getmodelmetadata
        with:
          model_name: rest.model_name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/models/{model-name}/ready
      name: v2-models-model-name-ready
      description: REST surface for v2-models-model_name-ready.
      operations:
      - method: GET
        name: checkmodelreadiness
        description: Check Model Readiness
        call: kserve-open-inference-protocol-models.checkmodelreadiness
        with:
          model_name: rest.model_name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/models/{model-name}/versions/{model-version}
      name: v2-models-model-name-versions-model-version
      description: REST surface for v2-models-model_name-versions-model_version.
      operations:
      - method: GET
        name: getmodelversionmetadata
        description: Get Model Version Metadata
        call: kserve-open-inference-protocol-models.getmodelversionmetadata
        with:
          model_name: rest.model_name
          model_version: rest.model_version
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/models/{model-name}/versions/{model-version}/ready
      name: v2-models-model-name-versions-model-version-ready
      description: REST surface for v2-models-model_name-versions-model_version-ready.
      operations:
      - method: GET
        name: checkmodelversionreadiness
        description: Check Model Version Readiness
        call: kserve-open-inference-protocol-models.checkmodelversionreadiness
        with:
          model_name: rest.model_name
          model_version: rest.model_version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kserve-open-inference-protocol-models-mcp
    port: 9090
    transport: http
    description: MCP adapter for KServe Open Inference Protocol API — Models. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-model-metadata
      description: Get Model Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-models.getmodelmetadata
      with:
        model_name: tools.model_name
      outputParameters:
      - type: object
        mapping: $.
    - name: check-model-readiness
      description: Check Model Readiness
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-models.checkmodelreadiness
      with:
        model_name: tools.model_name
      outputParameters:
      - type: object
        mapping: $.
    - name: get-model-version-metadata
      description: Get Model Version Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-models.getmodelversionmetadata
      with:
        model_name: tools.model_name
        model_version: tools.model_version
      outputParameters:
      - type: object
        mapping: $.
    - name: check-model-version-readiness
      description: Check Model Version Readiness
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kserve-open-inference-protocol-models.checkmodelversionreadiness
      with:
        model_name: tools.model_name
        model_version: tools.model_version
      outputParameters:
      - type: object
        mapping: $.
